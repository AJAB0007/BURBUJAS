version: '3.8'

services:
  mariadb:
    image: mariadb:latest
    container_name: mariadb-burbujas
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: burbujas_db
      MYSQL_USER: usuario_burbujas
      MYSQL_PASSWORD: tu_password_usuario
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  web:
    image: nginx:alpine
    container_name: web-burbujas
    restart: always
    ports:
      - "80:80"
    volumes:
      - .:/usr/share/nginx/html

volumes:
  mariadb_data:

