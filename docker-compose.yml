services:
  web:
    image: nginx:alpine
    container_name: web-burbujas
    ports:
      - "80:80"
    volumes:
      - .:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: always

  backend:
    image: node:22-alpine
    container_name: backend-burbujas
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    command: sh -c "npm install && node server.js"
    ports:
      - "3000:3000"
    depends_on:
      - mariadb
    restart: always

  mariadb:
    image: mariadb:latest
    container_name: mariadb-burbujas
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: burbujas
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: always

volumes:
  mariadb_data:
